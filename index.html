<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>縦書き原稿帳</title>
<style>
:root{--bg:#f2efe8;--side:#e7e1d7;--paper:#fffdf8;--ink:#222;--muted:#777;--line:#d0c9bd;--warn:#9a5a00;--bad:#a62323}
html[data-dark="1"]{--bg:#171716;--side:#21211f;--paper:#101010;--ink:#eee9df;--muted:#aaa;--line:#363631;--warn:#f0b65e;--bad:#ff8585}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.app{height:100%;display:grid;grid-template-columns:250px 1fr}.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:16px 16px 8px;font-weight:700}.sub{padding:0 16px 8px;color:var(--muted);font:11px system-ui}.bar{padding:8px;display:flex;gap:6px;flex-wrap:wrap}.list{flex:1;overflow:auto;padding:4px 8px}.item{display:flex;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:10px;border-radius:7px;gap:7px;align-items:center}.item:hover{background:#fff3}.item.on{background:var(--paper)}.item .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.dot{font:11px system-ui;color:var(--warn)}button,input{font:inherit;color:var(--ink)}button{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}.top{display:flex;gap:7px;padding:9px;border-bottom:1px solid var(--line);align-items:center}#title{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:15px;padding:6px;outline:none}.wrap{padding:14px;overflow:hidden;min-height:0}.editor{width:100%;height:100%;padding:30px 34px;background:var(--paper);border:1px solid var(--line);border-radius:9px;outline:none;white-space:pre-wrap;line-height:2;font-size:18px;overflow:auto}.editor.v{writing-mode:vertical-rl;text-orientation:mixed;line-break:strict;overflow-x:auto;overflow-y:hidden}.editor.h{writing-mode:horizontal-tb;overflow-y:auto;overflow-x:hidden;max-width:980px;margin:auto}.status{border-top:1px solid var(--line);padding:6px 12px;font:12px system-ui;color:var(--muted);display:flex;gap:16px;align-items:center}.status .grow{flex:1}.status .warn{color:var(--warn)}.status .bad{color:var(--bad)}.modalbg{position:fixed;z-index:20;inset:0;background:#0008;display:none;place-items:center;padding:20px}.modalbg.on{display:grid}.modal{width:min(590px,100%);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;font:14px system-ui}.grid{display:grid;grid-template-columns:120px 1fr;gap:9px;align-items:center}.grid input{width:100%;padding:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px}.remember{display:flex;gap:8px;align-items:center;margin-top:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}.hide{display:none}.busy{pointer-events:none;opacity:.7}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:10;inset:0 auto 0 0;width:min(84vw,310px);transform:translateX(-101%);transition:.15s}.side.open{transform:none}.menu{display:inline-block!important}.wrap{padding:7px}.editor{padding:22px;font-size:17px}.top{padding-left:max(9px,env(safe-area-inset-left));padding-right:max(9px,env(safe-area-inset-right))}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand">縦書き原稿帳</div><div class="sub">GitHubを正本にする個人用エディタ</div>
  <div class="bar"><button id="new">＋新規</button><button id="imp">TXT読込</button><input class="hide" type="file" id="file" accept=".txt,text/plain" multiple></div>
  <div class="list" id="list"></div>
  <div class="bar"><button id="reload">一覧更新</button><button id="exp">TXT出力</button><button id="del">削除</button></div>
</aside>
<main class="main">
  <div class="top"><button id="menu" class="menu hide">☰</button><input id="title" placeholder="原稿名"><button id="saveNow">保存</button><button id="mode">横書き</button><button id="dark">夜</button><button id="git">GitHub</button></div>
  <div class="wrap"><div id="ed" class="editor v" contenteditable="true" spellcheck="false"></div></div>
  <div class="status"><span id="chars">0字</span><span id="local">端末保存済み</span><span class="grow"></span><span id="sync">GitHub未接続</span></div>
</main>
</div>
<div class="modalbg" id="mb"><div class="modal" id="modal">
  <b>GitHub接続</b>
  <div class="grid" style="margin-top:12px"><label>Repository</label><input id="repo" value="sabamisobaby-cyber/tategaki-editor"><label>Branch</label><input id="branch" value="main"><label>原稿フォルダ</label><input id="prefix" value="manuscripts"><label>Token</label><input id="token" type="password" placeholder="Fine-grained PAT"></div>
  <label class="remember"><input id="remember" type="checkbox" checked> この端末にTokenを保存する</label>
  <div class="note">Private repoを読むため、各端末で最初の一度だけGitHub Tokenが必要。Tokenにはこのrepoの Contents: Read and write だけを与えるのがおすすめ。未同期の原稿がある間は原稿切替・ページ終了時に警告する。</div>
  <div class="actions"><button id="connect">接続して原稿一覧を読込</button><button id="pull">現在の原稿を再読込</button><button id="push">現在の原稿を保存</button><button id="close">閉じる</button></div>
</div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const CACHE='tategaki_docs_v2', CUR='tategaki_cur_v2', CFG='tategaki_git_v2', TOK='tategaki_token_v2';
const DEFAULT_CFG={repo:'sabamisobaby-cyber/tategaki-editor',branch:'main',prefix:'manuscripts'};
let docs=loadDocs(), cur=localStorage.getItem(CUR)||'', remoteTimer=null, saveChain=Promise.resolve(), switching=false;
let vertical=localStorage.getItem('tategaki_mode')!=='h';
function loadDocs(){try{let v=JSON.parse(localStorage.getItem(CACHE)||'[]');if(Array.isArray(v))return v}catch{}try{let old=JSON.parse(localStorage.getItem('tategaki_docs_v1')||'[]');if(Array.isArray(old))return old.map(d=>({...d,dirty:false,sha:null}))}catch{}return[]}
function current(){return docs.find(d=>d.id===cur)}
function editorText(){return $('#ed').innerText.replace(/\u00a0/g,' ')}
function setEditorText(t){$('#ed').textContent=t||'';stats()}
function safeName(s){return(s||'untitled').trim().replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,80)||'untitled'}
function newId(){return 'd_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function titleFromFilename(n){const map={'nozokiman.txt':'のぞきまん','happoshu.txt':'発泡酒練習テキスト'};return map[n]||n.replace(/\.txt$/i,'')}
function flush(){let d=current();if(!d)return;d.title=$('#title').value||d.title||'無題';d.text=editorText()}
function saveLocal(label='端末保存済み'){flush();localStorage.setItem(CACHE,JSON.stringify(docs));localStorage.setItem(CUR,cur||'');$('#local').textContent=label;render()}
function stats(){$('#chars').textContent=editorText().length.toLocaleString()+'字'}
function setSync(msg,cls=''){let e=$('#sync');e.textContent=msg;e.className=cls}
function setBusy(v){document.body.classList.toggle('busy',v)}
function render(){let l=$('#list');l.innerHTML='';docs.forEach(d=>{let b=document.createElement('button');b.className='item'+(d.id===cur?' on':'');let n=document.createElement('span');n.className='name';n.textContent=d.title||titleFromFilename(d.filename||'無題.txt');b.appendChild(n);if(d.dirty){let dot=document.createElement('span');dot.className='dot';dot.textContent='●';b.appendChild(dot)}b.onclick=()=>selectDoc(d.id);l.appendChild(b)})}
function showDoc(id){cur=id;localStorage.setItem(CUR,cur);let d=current();if(!d){$('#title').value='';setEditorText('');render();return}$('#title').value=d.title||titleFromFilename(d.filename);setEditorText(d.text||'');render();$('#side').classList.remove('open');setSync(d.dirty?'GitHub未同期':'GitHub保存済み',d.dirty?'warn':'')}
function cfgStored(){let c=DEFAULT_CFG;try{c={...c,...JSON.parse(localStorage.getItem(CFG)||'{}')}}catch{}let token=localStorage.getItem(TOK)||sessionStorage.getItem(TOK)||'';return{...c,token}}
function cfgFromModal(requireToken=true){let g={repo:$('#repo').value.trim(),branch:$('#branch').value.trim()||'main',prefix:$('#prefix').value.trim().replace(/^\/+|\/+$/g,''),token:$('#token').value.trim()};if(!g.repo||(requireToken&&!g.token))throw Error('RepositoryとTokenを入力してください');localStorage.setItem(CFG,JSON.stringify({repo:g.repo,branch:g.branch,prefix:g.prefix}));if(g.token){if($('#remember').checked){localStorage.setItem(TOK,g.token);sessionStorage.removeItem(TOK)}else{sessionStorage.setItem(TOK,g.token);localStorage.removeItem(TOK)}}return g}
function fillModal(){let g=cfgStored();$('#repo').value=g.repo;$('#branch').value=g.branch;$('#prefix').value=g.prefix;$('#token').value=g.token;$('#remember').checked=!!localStorage.getItem(TOK)}
function hasToken(){return !!cfgStored().token}
function apiPath(g,p){return `https://api.github.com/repos/${g.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(g.branch)}`}
function headers(g){return{Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function ghGet(g,p){let r=await fetch(apiPath(g,p),{headers:headers(g),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}
function enc(s){let u=new TextEncoder().encode(s),b='';for(let i=0;i<u.length;i+=32768)b+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(b)}
function dec(s){let b=atob((s||'').replaceAll('\n','')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}
async function ghPut(g,p,t,sha){let body={message:'Save manuscript: '+p,content:enc(t),branch:g.branch};if(sha)body.sha=sha;let url=`https://api.github.com/repos/${g.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;let r=await fetch(url,{method:'PUT',headers:{...headers(g),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}
async function ghDelete(g,p,sha){let url=`https://api.github.com/repos/${g.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;let r=await fetch(url,{method:'DELETE',headers:{...headers(g),'Content-Type':'application/json'},body:JSON.stringify({message:'Delete manuscript: '+p,sha,branch:g.branch})});if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}
function remotePath(g,d){if(!d.filename)d.filename=safeName(d.title)+'.txt';return(g.prefix?g.prefix+'/':'')+d.filename}
function markEdited(){let d=current();if(!d)return;d.title=$('#title').value||d.title||'無題';d.text=editorText();d.dirty=true;saveLocal('端末保存済み');setSync(hasToken()?'GitHub未同期':'GitHub未接続・端末のみ','warn');clearTimeout(remoteTimer);remoteTimer=setTimeout(()=>queuePush(d,'auto').catch(()=>{}),1200);stats()}
async function pushDoc(d,reason='manual'){
  if(!d||!d.dirty)return true;let g=cfgStored();if(!g.token){setSync('GitHub未接続・端末のみ','warn');throw Error('GitHub未接続です')}
  const snapshot=d.text, p=remotePath(g,d);setSync('GitHub保存中…');
  let remote=await ghGet(g,p);
  if(remote&&d.sha&&remote.sha!==d.sha){setSync('競合：保存停止','bad');throw Error('別端末で原稿が更新されています。GitHub版を確認してから再読込してください。端末側の本文は消していません。')}
  let out=await ghPut(g,p,snapshot,remote&&remote.sha);d.sha=out.content&&out.content.sha?out.content.sha:(remote&&remote.sha)||d.sha;
  if(d.text===snapshot)d.dirty=false;saveLocal();setSync(d.dirty?'GitHub未同期':'GitHub保存済み',d.dirty?'warn':'');if(d.dirty)scheduleRemote();return true
}
function queuePush(d,reason='manual'){saveChain=saveChain.catch(()=>{}).then(()=>pushDoc(d,reason));return saveChain}
function scheduleRemote(){clearTimeout(remoteTimer);let d=current();if(d&&d.dirty)remoteTimer=setTimeout(()=>queuePush(d,'auto').catch(e=>{setSync('自動保存失敗','bad');console.error(e)}),1200)}
async function saveBeforeSwitch(){flush();saveLocal();let d=current();if(!d||!d.dirty)return true;try{await queuePush(d,'switch');return true}catch(e){alert('原稿を切り替えません。\n\n切替前のGitHub保存に失敗しました。\n端末には保存されています。\n\n'+e.message);return false}}
async function selectDoc(id){if(switching||id===cur)return;switching=true;try{if(await saveBeforeSwitch())showDoc(id)}finally{switching=false}}
async function syncRemoteList(){let g=cfgStored();if(!g.token){fillModal();$('#mb').classList.add('on');setSync('GitHub未接続','warn');return false}setSync('原稿一覧を読込中…');let list=await ghGet(g,g.prefix);if(!Array.isArray(list))throw Error('manuscriptsフォルダを読めませんでした');let remoteFiles=list.filter(x=>x.type==='file'&&/\.txt$/i.test(x.name));let merged=[];let conflict=false;
  for(const f of remoteFiles){let old=docs.find(d=>d.filename===f.name);if(old&&old.dirty){if(old.sha===f.sha){merged.push(old);queuePush(old,'startup').catch(()=>{})}else{merged.push(old);conflict=true}continue}let full=await ghGet(g,(g.prefix?g.prefix+'/':'')+f.name);merged.push({id:old?old.id:newId(),title:old&&old.title?old.title:titleFromFilename(f.name),filename:f.name,text:dec(full.content),sha:full.sha,dirty:false})}
  for(const d of docs){if(!merged.some(x=>x.id===d.id)&&d.dirty)merged.push(d)}docs=merged;if(!docs.length){let d={id:newId(),title:'無題',filename:'',text:'',sha:null,dirty:true};docs=[d]}
  if(!docs.some(d=>d.id===cur))cur=docs[0].id;saveLocal();showDoc(cur);setSync(conflict?'未同期の競合あり':'GitHub同期済み',conflict?'bad':'');return true
}
async function pullCurrent(){let d=current();if(!d)return;flush();saveLocal();if(d.dirty&&!confirm('端末側の未同期本文をGitHub版で上書きしますか？'))return;let g=cfgStored();if(!g.token)throw Error('GitHub未接続です');let p=remotePath(g,d),o=await ghGet(g,p);if(!o)throw Error(p+' がありません');d.text=dec(o.content);d.sha=o.sha;d.dirty=false;saveLocal();setEditorText(d.text);setSync('GitHub版を読込済み')}
function mode(){let e=$('#ed');e.className='editor '+(vertical?'v':'h');$('#mode').textContent=vertical?'横書き':'縦書き';localStorage.setItem('tategaki_mode',vertical?'v':'h')}
function download(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#ed').addEventListener('input',markEdited);$('#title').addEventListener('input',markEdited);
$('#new').onclick=async()=>{if(!(await saveBeforeSwitch()))return;let d={id:newId(),title:'無題',filename:'',text:'',sha:null,dirty:true};docs.unshift(d);saveLocal();showDoc(d.id);$('#title').select()};
$('#imp').onclick=()=>$('#file').click();$('#file').onchange=async e=>{if(!(await saveBeforeSwitch())){e.target.value='';return}for(let f of e.target.files){docs.unshift({id:newId(),title:f.name.replace(/\.txt$/i,''),filename:f.name,text:await f.text(),sha:null,dirty:true})}cur=docs[0].id;saveLocal();showDoc(cur);scheduleRemote();e.target.value=''};
$('#exp').onclick=()=>{flush();let d=current();if(d)download((d.filename||safeName(d.title)+'.txt'),d.text)};
$('#del').onclick=async()=>{let d=current();if(!d||!confirm('この原稿を削除しますか？\nGitHub上のファイルも削除します。'))return;let g=cfgStored();if(d.filename&&g.token){try{let p=remotePath(g,d),o=await ghGet(g,p);if(o)await ghDelete(g,p,o.sha)}catch(e){alert('GitHubから削除できなかったので中止しました。\n'+e.message);return}}docs=docs.filter(x=>x.id!==d.id);if(!docs.length)docs=[{id:newId(),title:'無題',filename:'',text:'',sha:null,dirty:true}];cur=docs[0].id;saveLocal();showDoc(cur)};
$('#reload').onclick=()=>syncRemoteList().catch(e=>{setSync('一覧更新失敗','bad');alert(e.message)});
$('#saveNow').onclick=async()=>{flush();let d=current();if(!d)return;d.dirty=true;saveLocal();try{await queuePush(d,'manual')}catch(e){alert('GitHub保存に失敗しました。\n端末には保存されています。\n\n'+e.message)}};
$('#mode').onclick=()=>{vertical=!vertical;mode()};$('#dark').onclick=()=>{let d=document.documentElement.dataset.dark==='1';document.documentElement.dataset.dark=d?'0':'1';localStorage.setItem('tategaki_dark',d?'0':'1');$('#dark').textContent=d?'夜':'昼'};$('#menu').onclick=()=>$('#side').classList.toggle('open');
const mb=$('#mb');$('#git').onclick=()=>{fillModal();mb.classList.add('on')};$('#close').onclick=()=>mb.classList.remove('on');mb.onclick=e=>{if(e.target===mb)mb.classList.remove('on')};
$('#connect').onclick=async()=>{try{cfgFromModal();setBusy(true);await syncRemoteList();mb.classList.remove('on')}catch(e){setSync('接続失敗','bad');alert(e.message)}finally{setBusy(false)}};
$('#pull').onclick=async()=>{try{cfgFromModal();setBusy(true);await pullCurrent();mb.classList.remove('on')}catch(e){alert(e.message)}finally{setBusy(false)}};
$('#push').onclick=async()=>{try{cfgFromModal();flush();let d=current();if(d)d.dirty=true;saveLocal();setBusy(true);await queuePush(d,'manual');mb.classList.remove('on')}catch(e){alert(e.message)}finally{setBusy(false)}};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#saveNow').click()}});
window.addEventListener('beforeunload',e=>{flush();saveLocal();if(docs.some(d=>d.dirty)){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();saveLocal();let d=current();if(d&&d.dirty&&hasToken())queuePush(d,'hidden').catch(()=>{})}});
window.addEventListener('online',()=>{let d=current();if(d&&d.dirty&&hasToken())queuePush(d,'online').catch(()=>{})});
async function init(){document.documentElement.dataset.dark=localStorage.getItem('tategaki_dark')||'0';$('#dark').textContent=document.documentElement.dataset.dark==='1'?'昼':'夜';mode();if(!docs.length)docs=[{id:newId(),title:'接続してください',filename:'',text:'',sha:null,dirty:false}];if(!docs.some(d=>d.id===cur))cur=docs[0].id;showDoc(cur);if(hasToken()){try{await syncRemoteList()}catch(e){setSync('GitHub読込失敗・端末版を表示','bad');console.error(e)}}else{fillModal();setTimeout(()=>mb.classList.add('on'),120)}}
init();
</script>
</body></html>
