<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>縦書き原稿帳</title><style>
:root{--b:#f2efe8;--s:#e7e1d7;--p:#fffdf8;--i:#222;--m:#777;--l:#d0c9bd;--w:#9a5a00;--e:#a62323}html[data-d="1"]{--b:#171716;--s:#21211f;--p:#101010;--i:#eee9df;--m:#aaa;--l:#363631;--w:#f0b65e;--e:#ff8585}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--b);color:var(--i);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.app{height:100%;display:grid;grid-template-columns:250px 1fr}.side{background:var(--s);border-right:1px solid var(--l);display:flex;flex-direction:column}.brand{padding:16px 16px 4px;font-weight:700}.sub{padding:0 16px 8px;color:var(--m);font:11px system-ui}.bar{padding:8px;display:flex;gap:6px;flex-wrap:wrap}.list{flex:1;overflow:auto;padding:4px 8px}.item{display:flex;width:100%;border:0;background:transparent;color:var(--i);padding:10px;border-radius:7px;gap:7px;text-align:left}.item.on{background:var(--p)}.item .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{color:var(--w);font:11px system-ui;white-space:nowrap}button,input{font:inherit;color:var(--i)}button{background:var(--p);border:1px solid var(--l);border-radius:7px;padding:7px 9px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}.top{display:flex;gap:7px;padding:9px;border-bottom:1px solid var(--l)}#title{flex:1;min-width:0;border:0;background:transparent;color:var(--i);padding:6px;outline:none}.wrap{padding:14px;overflow:hidden;min-height:0}.ed{width:100%;height:100%;padding:30px 34px;background:var(--p);border:1px solid var(--l);border-radius:9px;outline:none;white-space:pre-wrap;line-height:2;font-size:18px;overflow:auto}.ed[contenteditable="false"]{opacity:.72}.ed.v{writing-mode:vertical-rl;text-orientation:mixed;line-break:strict;overflow-x:auto;overflow-y:hidden}.ed.h{writing-mode:horizontal-tb;overflow-y:auto;overflow-x:hidden;max-width:980px;margin:auto}.st{border-top:1px solid var(--l);padding:6px 12px;font:12px system-ui;color:var(--m);display:flex;gap:16px}.grow{flex:1}.warn{color:var(--w)}.bad{color:var(--e)}.mb{position:fixed;z-index:20;inset:0;background:#0008;display:none;place-items:center;padding:20px}.mb.on{display:grid}.modal{width:min(590px,100%);background:var(--p);border:1px solid var(--l);border-radius:12px;padding:18px;font:14px system-ui}.grid{display:grid;grid-template-columns:120px 1fr;gap:9px;align-items:center}.grid input{width:100%;padding:8px;border:1px solid var(--l);background:var(--b);border-radius:6px}.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.note{font-size:12px;color:var(--m);line-height:1.5;margin-top:10px}.hide{display:none}.busy{pointer-events:none;opacity:.7}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:10;inset:0 auto 0 0;width:min(84vw,310px);transform:translateX(-101%);transition:.15s}.side.open{transform:none}.menu{display:inline-block!important}.wrap{padding:7px}.ed{padding:22px;font-size:17px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">縦書き原稿帳</div><div class="sub">Private GitHub原稿を正本にする個人用エディタ v0.9</div><div class="bar"><button id="new">＋新規</button><button id="imp">TXT読込</button><input id="file" class="hide" type="file" accept=".txt,text/plain" multiple></div><div id="list" class="list"></div><div class="bar"><button id="reload">一覧更新</button><button id="exp">TXT出力</button><button id="del">削除</button></div></aside><main class="main"><div class="top"><button id="menu" class="menu hide">☰</button><input id="title" placeholder="原稿名"><button id="save">GitHubへ反映</button><button id="mode">横書き</button><button id="dark">夜</button><button id="git">GitHub</button></div><div class="wrap"><div id="ed" class="ed v" contenteditable="true" spellcheck="false"></div></div><div class="st"><span id="chars">0字</span><span id="local">端末保存済み</span><span class="grow"></span><span id="sync">GitHub未接続</span></div></main></div><div id="mb" class="mb"><div class="modal"><b>GitHub接続</b><div class="grid" style="margin-top:12px"><label>Repository</label><input id="repo" value="sabamisobaby-cyber/tategaki-editor"><label>Branch</label><input id="branch" value="main"><label>原稿フォルダ</label><input id="prefix" value="manuscripts"><label>Token</label><input id="token" type="password" placeholder="Fine-grained PAT"></div><label style="display:flex;gap:8px;margin-top:12px"><input id="remember" type="checkbox" checked>この端末にTokenを保存</label><div class="note">TokenはPrivate repoの Contents: Read and write のみでOK。接続前は編集不可。入力中は端末へ即保存。GitHubへの反映は完全に手動で、原稿切替では保存も再読込もしない。「GitHubへ反映」から反映する原稿を選ぶ。GitHub版で本文を置き換えるのは「GitHub版で再読込」を押した時だけ。</div><div class="acts"><button id="connect">接続して一覧読込</button><button id="pull">GitHub版で再読込</button><button id="push">未同期を反映</button><button id="close">閉じる</button></div></div></div><div id="syncMb" class="mb"><div class="modal"><b>GitHubへ反映</b><div class="note">未同期の原稿だけ表示します。反映したいTXTにチェックを入れてください。</div><div id="syncRows" style="margin-top:12px;max-height:50vh;overflow:auto"></div><div class="acts"><button id="syncDo">選択した原稿を反映</button><button id="syncCancel">閉じる</button></div></div></div><script>
'use strict';
const $=s=>document.querySelector(s),CACHE='tg_docs4',CUR='tg_cur4',CFG='tg_cfg3',TOK='tg_tok3',DEF={repo:'sabamisobaby-cyber/tategaki-editor',branch:'main',prefix:'manuscripts'};
let docs=J(CACHE,[]),cur=localStorage.getItem(CUR)||'',chain=Promise.resolve(),switching=false,vertical=localStorage.getItem('tg_mode')!=='h',connected=false;
function J(k,d){try{let v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}}
function c(){return docs.find(x=>x.id===cur)}
function id(){return'D'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function txt(){return ed.innerText.replace(/\u00a0/g,' ')}
function setTxt(t){ed.textContent=t||'';stats()}
function safe(s){return(s||'untitled').trim().replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,80)||'untitled'}
function title(n){return({'nozokiman.txt':'のぞきまん','happoshu.txt':'発泡酒練習テキスト'}[n]||n.replace(/\.txt$/i,''))}
function flush(){let d=c();if(d&&connected){d.title=$('#title').value||d.title||'無題';d.text=txt()}}
function local(msg='端末保存済み'){flush();localStorage.setItem(CACHE,JSON.stringify(docs));localStorage.setItem(CUR,cur||'');$('#local').textContent=msg;render()}
function stats(){$('#chars').textContent=txt().length.toLocaleString()+'字'}
function dirtyCount(){return docs.filter(d=>d.dirty).length}
function stat(s,cl=''){$('#sync').textContent=s;$('#sync').className=cl}
function updateSyncStatus(){let n=dirtyCount();if(!connected)return stat('GitHub未接続','warn');if(n)stat(`GitHub未同期（${n}本）`,'warn');else stat('GitHub同期済み')}
function render(){list.innerHTML='';for(const d of docs){let b=document.createElement('button');b.className='item'+(d.id===cur?' on':'');let n=document.createElement('span');n.className='n';n.textContent=d.title||title(d.filename||'無題.txt');b.appendChild(n);if(d.dirty){let u=document.createElement('span');u.className='dot';u.textContent='● 未同期';b.appendChild(u)}b.onclick=()=>select(d.id);list.appendChild(b)}}
function show(i){cur=i||'';localStorage.setItem(CUR,cur);let d=c();if(!d){$('#title').value='';setTxt('');render();updateSyncStatus();return}$('#title').value=d.title||title(d.filename||'');setTxt(d.text||'');render();side.classList.remove('open');updateSyncStatus()}
function lockEditor(v){connected=!v;ed.contentEditable=v?'false':'true';$('#title').disabled=v;for(const sel of ['#new','#imp','#reload','#exp','#del','#save','#mode'])$(sel).disabled=v;if(v){$('#title').value='';setTxt('');cur='';render();stat('GitHub未接続','warn')}}
function conf(){let q={...DEF,...J(CFG,{})};q.token=localStorage.getItem(TOK)||sessionStorage.getItem(TOK)||'';return q}
function modalCfg(){let q={repo:repo.value.trim(),branch:branch.value.trim()||'main',prefix:prefix.value.trim().replace(/^\/+|\/+$/g,''),token:token.value.trim()};if(!q.repo||!q.token)throw Error('RepositoryとTokenを入力してください');localStorage.setItem(CFG,JSON.stringify({repo:q.repo,branch:q.branch,prefix:q.prefix}));if(remember.checked){localStorage.setItem(TOK,q.token);sessionStorage.removeItem(TOK)}else{sessionStorage.setItem(TOK,q.token);localStorage.removeItem(TOK)}return q}
function fill(){let q=conf();repo.value=q.repo;branch.value=q.branch;prefix.value=q.prefix;token.value=q.token;remember.checked=!!localStorage.getItem(TOK)}
function path(q,p){return`https://api.github.com/repos/${q.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(q.branch)}`}
function hd(q){return{Authorization:'Bearer '+q.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function get(q,p){let r=await fetch(path(q,p),{headers:hd(q),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}
function enc(s){let u=new TextEncoder().encode(s),b='';for(let i=0;i<u.length;i+=32768)b+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(b)}
function dec(s){let b=atob((s||'').replaceAll('\n','')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}
async function put(q,p,t,sha){let u=path(q,p).split('?')[0],body={message:'Save manuscript: '+p,content:enc(t),branch:q.branch};if(sha)body.sha=sha;let r=await fetch(u,{method:'PUT',headers:{...hd(q),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}
async function rm(q,p,sha){let u=path(q,p).split('?')[0],r=await fetch(u,{method:'DELETE',headers:{...hd(q),'Content-Type':'application/json'},body:JSON.stringify({message:'Delete manuscript: '+p,sha,branch:q.branch})});if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}
function rp(q,d){if(!d.filename)d.filename=safe(d.title)+'.txt';return(q.prefix?q.prefix+'/':'')+d.filename}
async function pushDoc(d){if(!d||!d.dirty)return true;let q=conf();if(!q.token)throw Error('GitHub未接続です');let snap=d.text,p=rp(q,d),remote=await get(q,p);if(remote&&!d.sha)throw Error(`${d.title||d.filename}: GitHubに同名TXTがあります。上書きせず停止しました`);if(!remote&&d.sha)throw Error(`${d.title||d.filename}: GitHub側で削除されています。再読込して確認してください`);if(remote&&d.sha&&remote.sha!==d.sha)throw Error(`${d.title||d.filename}: GitHub側に別の更新があります。上書きせず停止しました`);let o=await put(q,p,snap,remote&&remote.sha);d.sha=o.content?.sha||remote?.sha||d.sha;if(d.text===snap)d.dirty=false;local();return true}
function queue(d){chain=chain.catch(()=>{}).then(()=>pushDoc(d));return chain}
function edit(){if(!connected)return;let d=c();if(!d)return;d.title=$('#title').value||d.title||'無題';d.text=txt();d.dirty=true;local();updateSyncStatus();stats()}
async function select(i){if(switching||i===cur||!connected)return;switching=true;try{flush();local();show(i)}finally{switching=false}}
async function syncList(){let q=conf();if(!q.token)throw Error('GitHub未接続です');stat('原稿一覧を読込中…');flush();local();let a=await get(q,q.prefix);if(!Array.isArray(a))throw Error('原稿フォルダを読めません');let fs=a.filter(x=>x.type==='file'&&/\.txt$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,'ja')),old=docs,prev=c()?.filename||'',fresh=[];
for(const f of fs){let o=old.find(d=>d.filename===f.name);if(o?.dirty){fresh.push(o);continue}let x=await get(q,(q.prefix?q.prefix+'/':'')+f.name);fresh.push({id:o?.id||'GH_'+f.name,title:o?.title||title(f.name),filename:f.name,text:dec(x.content),sha:x.sha,dirty:false})}
for(const d of old){if((d.dirty||!d.filename)&&!fresh.some(x=>x.id===d.id||x.filename&&x.filename===d.filename))fresh.push(d)}
docs=fresh;if(!docs.length){docs=[{id:id(),title:'無題',filename:'',text:'',sha:null,dirty:false}]}let pick=docs.find(d=>d.filename===prev)||docs.find(d=>d.id===cur)||docs[0];cur=pick.id;local();show(cur);updateSyncStatus()}
function mode(){ed.className='ed '+(vertical?'v':'h');$('#mode').textContent=vertical?'横書き':'縦書き';localStorage.setItem('tg_mode',vertical?'v':'h')}
function dl(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
ed.oninput=edit;$('#title').oninput=edit;
$('#new').onclick=()=>{if(!connected)return;flush();local();let d={id:id(),title:'無題',filename:'',text:'',sha:null,dirty:false};docs.unshift(d);local();show(d.id);$('#title').select()};
imp.onclick=()=>{if(connected)file.click()};
file.onchange=async e=>{if(!connected)return;flush();local();for(const f of e.target.files)docs.unshift({id:id(),title:f.name.replace(/\.txt$/i,''),filename:f.name,text:await f.text(),sha:null,dirty:true});cur=docs[0].id;local();show(cur);updateSyncStatus();e.target.value=''};
exp.onclick=()=>{flush();let d=c();if(d)dl(d.filename||safe(d.title)+'.txt',d.text)};
del.onclick=async()=>{let d=c();if(!d||!confirm('この原稿をGitHubからも削除しますか？'))return;let q=conf();if(d.filename&&q.token){let p=rp(q,d),o=await get(q,p);if(o)await rm(q,p,o.sha)}docs=docs.filter(x=>x.id!==d.id);if(!docs.length)docs=[{id:id(),title:'無題',filename:'',text:'',sha:null,dirty:false}];cur=docs[0].id;local();show(cur)};
reload.onclick=()=>syncList().catch(e=>{stat('一覧更新失敗','bad');alert(e.message)});
function openSyncModal(){if(!connected)return;flush();local();let targets=docs.filter(d=>d.dirty);syncRows.innerHTML='';if(!targets.length){let p=document.createElement('div');p.className='note';p.textContent='未同期の原稿はありません。';syncRows.appendChild(p)}else for(const d of targets){let lab=document.createElement('label');lab.style.cssText='display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px solid var(--l)';let cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.id=d.id;let tx=document.createElement('span');tx.textContent=d.title||title(d.filename||'無題.txt');lab.append(cb,tx);syncRows.appendChild(lab)}syncDo.disabled=!targets.length;syncMb.classList.add('on')}
save.onclick=openSyncModal;
$('#mode').onclick=()=>{vertical=!vertical;mode()};
dark.onclick=()=>{let d=document.documentElement.dataset.d==='1';document.documentElement.dataset.d=d?'0':'1';localStorage.setItem('tg_dark',d?'0':'1');dark.textContent=d?'夜':'昼'};
menu.onclick=()=>side.classList.toggle('open');git.onclick=()=>{fill();mb.classList.add('on')};close.onclick=()=>mb.classList.remove('on');
connect.onclick=async()=>{try{modalCfg();document.body.classList.add('busy');lockEditor(false);await syncList();mb.classList.remove('on')}catch(e){lockEditor(true);alert(e.message)}finally{document.body.classList.remove('busy')}};
pull.onclick=async()=>{try{let q=modalCfg(),d=c();if(!d)return;let o=await get(q,rp(q,d));if(!o)throw Error('GitHub上にありません');if(d.dirty&&!confirm('端末側の未同期本文をGitHub版で上書きしますか？'))return;d.text=dec(o.content);d.sha=o.sha;d.dirty=false;local();show(d.id);mb.classList.remove('on');updateSyncStatus()}catch(e){alert(e.message)}};
push.onclick=()=>{try{modalCfg();mb.classList.remove('on');openSyncModal()}catch(e){alert(e.message)}};
syncCancel.onclick=()=>syncMb.classList.remove('on');
syncDo.onclick=async()=>{flush();local();let ids=[...syncRows.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.dataset.id),targets=ids.map(i=>docs.find(d=>d.id===i)).filter(Boolean);if(!targets.length)return;syncDo.disabled=true;document.body.classList.add('busy');let errors=[];let ok=0;try{for(const d of targets){stat(`GitHubへ反映中… ${ok+1}/${targets.length}`);try{await queue(d);ok++}catch(e){errors.push(e.message||String(e))}}local();updateSyncStatus();syncMb.classList.remove('on');if(errors.length)alert(`反映成功 ${ok}本 / 失敗 ${errors.length}本\n\n`+errors.join('\n'))}finally{document.body.classList.remove('busy');syncDo.disabled=false}};
window.onbeforeunload=e=>{if(connected){flush();local()}if(docs.some(d=>d.dirty)){e.preventDefault();e.returnValue=''}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&connected){flush();local()}});
window.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(connected)save.click()}};
async function init(){document.documentElement.dataset.d=localStorage.getItem('tg_dark')||'0';dark.textContent=document.documentElement.dataset.d==='1'?'昼':'夜';mode();lockEditor(true);fill();let q=conf();if(q.token){try{lockEditor(false);await syncList()}catch(e){lockEditor(true);stat('GitHub接続失敗','bad');setTimeout(()=>mb.classList.add('on'),100)}}else setTimeout(()=>mb.classList.add('on'),100)}
init();

</script></body></html>
