<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>縦書き原稿帳</title><style>
:root{--b:#f2efe8;--s:#e7e1d7;--p:#fffdf8;--i:#222;--m:#777;--l:#d0c9bd;--w:#9a5a00;--e:#a62323}html[data-d="1"]{--b:#171716;--s:#21211f;--p:#101010;--i:#eee9df;--m:#aaa;--l:#363631;--w:#f0b65e;--e:#ff8585}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--b);color:var(--i);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.app{height:100%;display:grid;grid-template-columns:250px 1fr}.side{background:var(--s);border-right:1px solid var(--l);display:flex;flex-direction:column}.brand{padding:16px 16px 4px;font-weight:700}.sub{padding:0 16px 8px;color:var(--m);font:11px system-ui}.bar{padding:8px;display:flex;gap:6px;flex-wrap:wrap}.list{flex:1;overflow:auto;padding:4px 8px}.item{display:flex;width:100%;border:0;background:transparent;color:var(--i);padding:10px;border-radius:7px;gap:7px;text-align:left}.item.on{background:var(--p)}.item .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{color:var(--w)}button,input{font:inherit;color:var(--i)}button{background:var(--p);border:1px solid var(--l);border-radius:7px;padding:7px 9px;cursor:pointer}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}.top{display:flex;gap:7px;padding:9px;border-bottom:1px solid var(--l)}#title{flex:1;min-width:0;border:0;background:transparent;color:var(--i);padding:6px;outline:none}.wrap{padding:14px;overflow:hidden;min-height:0}.ed{width:100%;height:100%;padding:30px 34px;background:var(--p);border:1px solid var(--l);border-radius:9px;outline:none;white-space:pre-wrap;line-height:2;font-size:18px;overflow:auto}.ed.v{writing-mode:vertical-rl;text-orientation:mixed;line-break:strict;overflow-x:auto;overflow-y:hidden}.ed.h{writing-mode:horizontal-tb;overflow-y:auto;overflow-x:hidden;max-width:980px;margin:auto}.st{border-top:1px solid var(--l);padding:6px 12px;font:12px system-ui;color:var(--m);display:flex;gap:16px}.grow{flex:1}.warn{color:var(--w)}.bad{color:var(--e)}.mb{position:fixed;z-index:20;inset:0;background:#0008;display:none;place-items:center;padding:20px}.mb.on{display:grid}.modal{width:min(590px,100%);background:var(--p);border:1px solid var(--l);border-radius:12px;padding:18px;font:14px system-ui}.grid{display:grid;grid-template-columns:120px 1fr;gap:9px;align-items:center}.grid input{width:100%;padding:8px;border:1px solid var(--l);background:var(--b);border-radius:6px}.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.note{font-size:12px;color:var(--m);line-height:1.5;margin-top:10px}.hide{display:none}.busy{pointer-events:none;opacity:.7}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:10;inset:0 auto 0 0;width:min(84vw,310px);transform:translateX(-101%);transition:.15s}.side.open{transform:none}.menu{display:inline-block!important}.wrap{padding:7px}.ed{padding:22px;font-size:17px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">縦書き原稿帳</div><div class="sub">Private GitHub原稿を正本にする個人用エディタ v0.7</div><div class="bar"><button id="new">＋新規</button><button id="imp">TXT読込</button><input id="file" class="hide" type="file" accept=".txt,text/plain" multiple></div><div id="list" class="list"></div><div class="bar"><button id="reload">一覧更新</button><button id="exp">TXT出力</button><button id="del">削除</button></div></aside><main class="main"><div class="top"><button id="menu" class="menu hide">☰</button><input id="title" placeholder="原稿名"><button id="save">保存</button><button id="mode">横書き</button><button id="dark">夜</button><button id="git">GitHub</button></div><div class="wrap"><div id="ed" class="ed v" contenteditable="true" spellcheck="false"></div></div><div class="st"><span id="chars">0字</span><span id="local">端末保存済み</span><span class="grow"></span><span id="sync">GitHub未接続</span></div></main></div><div id="mb" class="mb"><div class="modal"><b>GitHub接続</b><div class="grid" style="margin-top:12px"><label>Repository</label><input id="repo" value="sabamisobaby-cyber/tategaki-editor"><label>Branch</label><input id="branch" value="main"><label>原稿フォルダ</label><input id="prefix" value="manuscripts"><label>Token</label><input id="token" type="password" placeholder="Fine-grained PAT"></div><label style="display:flex;gap:8px;margin-top:12px"><input id="remember" type="checkbox" checked>この端末にTokenを保存</label><div class="note">TokenはPrivate repoの Contents: Read and write のみでOK。入力中は端末へ即保存し、GitHubへは30分ごと＋原稿切替時＋手動保存時に保存する。原稿切替ではGitHub版を再読込しない。GitHub版で本文を置き換えるのは「GitHub版で再読込」を押した時だけ。</div><div class="acts"><button id="connect">接続して一覧読込</button><button id="pull">GitHub版で再読込</button><button id="push">現在を保存</button><button id="close">閉じる</button></div></div></div><script>
'use strict';const $=s=>document.querySelector(s),CACHE='tg_docs4',CUR='tg_cur4',CFG='tg_cfg3',TOK='tg_tok3',DEF={repo:'sabamisobaby-cyber/tategaki-editor',branch:'main',prefix:'manuscripts'};const AUTO_MS=30*60*1000;let docs=J(CACHE,[]),cur=localStorage.getItem(CUR)||'',timer=null,autoDocId='',chain=Promise.resolve(),switching=false,vertical=localStorage.getItem('tg_mode')!=='h';function J(k,d){try{let v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}}function c(){return docs.find(x=>x.id===cur)}function id(){return'D'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function txt(){return ed.innerText.replace(/\u00a0/g,' ')}function setTxt(t){ed.textContent=t||'';stats()}function safe(s){return(s||'untitled').trim().replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,80)||'untitled'}function title(n){return({'nozokiman.txt':'のぞきまん','happoshu.txt':'発泡酒練習テキスト'}[n]||n.replace(/\.txt$/i,''))}function flush(){let d=c();if(d){d.title=$('#title').value||d.title||'無題';d.text=txt()}}function local(msg='端末保存済み'){flush();localStorage.setItem(CACHE,JSON.stringify(docs));localStorage.setItem(CUR,cur);$('#local').textContent=msg;render()}function stats(){$('#chars').textContent=txt().length.toLocaleString()+'字'}function stat(s,cl=''){$('#sync').textContent=s;$('#sync').className=cl}function render(){list.innerHTML='';for(const d of docs){let b=document.createElement('button');b.className='item'+(d.id===cur?' on':'');b.innerHTML='<span class="n"></span>'+(d.dirty?'<span class="dot">●</span>':'');b.querySelector('.n').textContent=d.title||title(d.filename||'無題.txt');b.onclick=()=>select(d.id);list.appendChild(b)}}function show(i){cur=i;localStorage.setItem(CUR,i);let d=c();if(!d){$('#title').value='';setTxt('');render();return}$('#title').value=d.title||title(d.filename);setTxt(d.text);render();side.classList.remove('open');stat(d.dirty?'GitHub未同期':'GitHub保存済み',d.dirty?'warn':'')}function conf(){let q={...DEF,...J(CFG,{})};q.token=localStorage.getItem(TOK)||sessionStorage.getItem(TOK)||'';return q}function modalCfg(){let q={repo:repo.value.trim(),branch:branch.value.trim()||'main',prefix:prefix.value.trim().replace(/^\/+|\/+$/g,''),token:token.value.trim()};if(!q.repo||!q.token)throw Error('RepositoryとTokenを入力してください');localStorage.setItem(CFG,JSON.stringify({repo:q.repo,branch:q.branch,prefix:q.prefix}));if(remember.checked){localStorage.setItem(TOK,q.token);sessionStorage.removeItem(TOK)}else{sessionStorage.setItem(TOK,q.token);localStorage.removeItem(TOK)}return q}function fill(){let q=conf();repo.value=q.repo;branch.value=q.branch;prefix.value=q.prefix;token.value=q.token;remember.checked=!!localStorage.getItem(TOK)}function path(q,p){return`https://api.github.com/repos/${q.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(q.branch)}`}function hd(q){return{Authorization:'Bearer '+q.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}async function get(q,p){let r=await fetch(path(q,p),{headers:hd(q),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw Error('GitHub '+r.status);return r.json()}function enc(s){let u=new TextEncoder().encode(s),b='';for(let i=0;i<u.length;i+=32768)b+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(b)}function dec(s){let b=atob((s||'').replaceAll('\n','')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}async function put(q,p,t,sha){let u=path(q,p).split('?')[0],body={message:'Save manuscript: '+p,content:enc(t),branch:q.branch};if(sha)body.sha=sha;let r=await fetch(u,{method:'PUT',headers:{...hd(q),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('GitHub '+r.status+': '+await r.text());return r.json()}async function rm(q,p,sha){let u=path(q,p).split('?')[0],r=await fetch(u,{method:'DELETE',headers:{...hd(q),'Content-Type':'application/json'},body:JSON.stringify({message:'Delete manuscript: '+p,sha,branch:q.branch})});if(!r.ok)throw Error('GitHub '+r.status);return r.json()}function rp(q,d){if(!d.filename)d.filename=safe(d.title)+'.txt';return(q.prefix?q.prefix+'/':'')+d.filename}function cancelAuto(d){if(timer&&(!d||autoDocId===d.id)){clearTimeout(timer);timer=null;autoDocId=''}}function scheduleAuto(d){if(timer||!d?.dirty||!conf().token)return;autoDocId=d.id;timer=setTimeout(()=>{timer=null;autoDocId='';if(d.dirty)queue(d).catch(e=>{stat('30分自動保存失敗','bad');console.error(e)})},AUTO_MS)}function edit(){let d=c();if(!d)return;d.title=$('#title').value||d.title||'無題';d.text=txt();d.dirty=true;local();stat(conf().token?'GitHub未同期（30分自動保存待ち）':'GitHub未接続・端末のみ','warn');scheduleAuto(d);stats()}async function pushDoc(d){if(!d||!d.dirty)return true;let q=conf();if(!q.token)throw Error('GitHub未接続です');let snap=d.text,p=rp(q,d);stat('GitHub保存中…');let r=await get(q,p);if(r&&d.sha&&r.sha!==d.sha){stat('競合：保存停止','bad');throw Error('別端末で更新されています。端末側本文は保持しています。')}let o=await put(q,p,snap,r&&r.sha);d.sha=o.content?.sha||r?.sha||d.sha;if(d.text===snap)d.dirty=false;cancelAuto(d);if(d.dirty)scheduleAuto(d);local();stat(d.dirty?'GitHub未同期（30分自動保存待ち）':'GitHub保存済み',d.dirty?'warn':'');return true}function queue(d){chain=chain.catch(()=>{}).then(()=>pushDoc(d));return chain}async function beforeSwitch(){flush();local();let d=c();if(!d||!d.dirty)return true;try{await queue(d);return true}catch(e){alert('原稿を切り替えません。\nGitHub保存に失敗しました。端末には保存済みです。\n\n'+e.message);return false}}async function select(i){if(switching||i===cur)return;switching=true;try{if(await beforeSwitch())show(i)}finally{switching=false}}async function syncList(){let q=conf();if(!q.token){fill();mb.classList.add('on');return}stat('原稿一覧を読込中…');for(const d of docs.filter(x=>x.dirty)){try{await queue(d)}catch(e){stat('一覧更新停止・未同期あり','bad');throw Error('未同期原稿のGitHub保存に失敗したため、一覧更新を中止しました。端末側本文は保持しています。\n\n'+e.message)}}let a=await get(q,q.prefix);if(!Array.isArray(a))throw Error('原稿フォルダを読めません');let fs=a.filter(x=>x.type==='file'&&/\.txt$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,'ja')),prev=c()?.filename||'',fresh=[];for(const f of fs){let x=await get(q,(q.prefix?q.prefix+'/':'')+f.name);fresh.push({id:'GH_'+f.name,title:title(f.name),filename:f.name,text:dec(x.content),sha:x.sha,dirty:false})}docs=fresh;if(!docs.length){cur='';localStorage.setItem(CACHE,'[]');localStorage.setItem(CUR,'');$('#title').value='';setTxt('');render();stat('原稿がありません','warn');return}cur=(docs.find(d=>d.filename===prev)||docs[0]).id;local();show(cur);stat(`GitHub同期済み（${docs.length}本）`)}function mode(){ed.className='ed '+(vertical?'v':'h');$('#mode').textContent=vertical?'横書き':'縦書き';localStorage.setItem('tg_mode',vertical?'v':'h')}function dl(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}ed.oninput=edit;$('#title').oninput=edit;$('#new').onclick=async()=>{if(!(await beforeSwitch()))return;let d={id:id(),title:'無題',filename:'',text:'',sha:null,dirty:true};docs.unshift(d);local();show(d.id);$('#title').select()};imp.onclick=()=>file.click();file.onchange=async e=>{if(!(await beforeSwitch()))return;for(const f of e.target.files)docs.unshift({id:id(),title:f.name.replace(/\.txt$/i,''),filename:f.name,text:await f.text(),sha:null,dirty:true});cur=docs[0].id;local();show(cur);queue(c()).catch(()=>{});e.target.value=''};exp.onclick=()=>{flush();let d=c();if(d)dl(d.filename||safe(d.title)+'.txt',d.text)};del.onclick=async()=>{let d=c();if(!d||!confirm('この原稿をGitHubからも削除しますか？'))return;let q=conf();if(d.filename&&q.token){let p=rp(q,d),o=await get(q,p);if(o)await rm(q,p,o.sha)}docs=docs.filter(x=>x.id!==d.id);cur=docs[0]?.id||'';local();show(cur)};reload.onclick=()=>syncList().catch(e=>{stat('一覧更新失敗','bad');alert(e.message)});save.onclick=()=>{let d=c();if(!d)return;flush();d.dirty=true;local();queue(d).catch(e=>alert('GitHub保存失敗。端末には保存済み。\n'+e.message))};$('#mode').onclick=()=>{vertical=!vertical;mode()};dark.onclick=()=>{let d=document.documentElement.dataset.d==='1';document.documentElement.dataset.d=d?'0':'1';localStorage.setItem('tg_dark',d?'0':'1');dark.textContent=d?'夜':'昼'};menu.onclick=()=>side.classList.toggle('open');git.onclick=()=>{fill();mb.classList.add('on')};close.onclick=()=>mb.classList.remove('on');connect.onclick=async()=>{try{modalCfg();document.body.classList.add('busy');await syncList();mb.classList.remove('on')}catch(e){alert(e.message)}finally{document.body.classList.remove('busy')}};pull.onclick=async()=>{try{let q=modalCfg(),d=c();if(!d)return;let o=await get(q,rp(q,d));if(!o)throw Error('GitHub上にありません');if(d.dirty&&!confirm('端末側の未同期本文をGitHub版で上書きしますか？'))return;d.text=dec(o.content);d.sha=o.sha;d.dirty=false;local();show(d.id);mb.classList.remove('on')}catch(e){alert(e.message)}};push.onclick=()=>{modalCfg();save.click();mb.classList.remove('on')};window.onbeforeunload=e=>{flush();local();if(docs.some(d=>d.dirty)){e.preventDefault();e.returnValue=''}};document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();local()}});window.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save.click()}};async function init(){document.documentElement.dataset.d=localStorage.getItem('tg_dark')||'0';dark.textContent=document.documentElement.dataset.d==='1'?'昼':'夜';mode();if(docs.length){if(!docs.some(d=>d.id===cur))cur=docs[0].id;show(cur)}else{render();stat('GitHub未接続','warn')}if(conf().token){try{await syncList()}catch(e){stat('GitHub読込失敗・端末版表示','bad')}}else{fill();setTimeout(()=>mb.classList.add('on'),100)}}init();
</script></body></html>
